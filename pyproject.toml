[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "chisinau-rent-system"
version = "0.1.0"
description = "Incremental engineering foundations for the existing Chișinău rent application"
requires-python = ">=3.13"
dependencies = ["jsonschema==4.26.0"]
license-files = ["LICENSE"]

[project.optional-dependencies]
data = ["PyYAML==6.0.3"]
parquet = ["pyarrow==26.0.1"]

[project.scripts]
rent-check-architecture = "rent_checks.architecture:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rent_contracts = ["schemas/v1/*.json", "schemas/v2/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
markers = ["legacy_artifact: requires the private, locally trained legacy model.joblib"]
addopts = "--strict-markers"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/test_features.py" = ["E402", "F401", "I"]
