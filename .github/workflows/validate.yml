name: Unprivileged validation

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundations:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, resolved 2026-11-02
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, resolved 2026-11-02
        with:
          python-version: "3.13"
      - name: Validate workflow semantics (pinned actionlint)
        run: |
          python scripts/install_actionlint.py --directory "$RUNNER_TEMP/rent-actionlint"
          "$RUNNER_TEMP/rent-actionlint/actionlint" -shellcheck= -pyflakes=
      - name: Install hash-locked dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Install source without resolving dependencies or build requirements
        run: python -m pip install --no-deps --no-build-isolation -e .
      - name: Static checks on foundations
        run: |
          python -m ruff check src scripts tests/foundations tests/conftest.py
          python -m ruff format --check src scripts tests/foundations tests/conftest.py
      - name: Dependency boundaries
        run: rent-check-architecture --root .
      - name: Deterministic tests (private artifact checks explicitly skipped when unavailable)
        env:
          ACTIONLINT: ${{ runner.temp }}/rent-actionlint/actionlint
          MPLCONFIGDIR: ${{ runner.temp }}/rent-matplotlib
          NUMBA_CACHE_DIR: ${{ runner.temp }}/rent-numba
        run: python -m pytest -q -ra
      - name: Build distribution
        run: python -m build --no-isolation

# This is Level 1 PR validation source, not a protected runner/promotion workflow.
# Protected checks must be installed from a reviewed revision and enforced by host rules.
