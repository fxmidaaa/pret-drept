name: MLOps checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DVC_NO_ANALYTICS: "true"
  MLFLOW_DISABLE_TELEMETRY: "true"

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13.16"
      - name: Install project and tracking dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Lint and check formatting
        run: |
          python -m ruff check mlops *.py tests
          python -m ruff format --check mlops *.py tests
      - name: Validate DVC metadata and exercise stages on the test fixture
        run: |
          dvc stage list --all --fail
          python -m mlops.prepare data/sample/demo.csv artifacts/demo --synthetic
          python train.py artifacts/demo
          python -m mlops.evaluate artifacts/demo
          python predict.py --model artifacts/demo/model.joblib
      - name: Test predictions and MLflow registry round trip
        run: PRET_DREPT_MODEL=artifacts/demo/model.joblib python -m pytest -q
      - name: Exercise the tracking and registration CLI
        run: python -m mlops.track artifacts/demo --register
      - name: Build and exercise API and Spark in the local image
        run: |
          docker build -t pret-drept:ci .
          bash scripts/smoke_container.sh pret-drept:ci artifacts/demo/model.joblib
