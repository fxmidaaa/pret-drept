name: Safe MLOps demo

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DVC_NO_ANALYTICS: "true"
  MLFLOW_DISABLE_TELEMETRY: "true"

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13.16"
      - name: Install project and tracking dependencies
        run: |
          python -m pip install -r requirements-mlops.txt
          python -m pip check
          python -m venv .venv-mlflow
          .venv-mlflow/bin/python -m pip install -r requirements-tracking.txt
      - name: Lint and check formatting
        run: |
          python -m ruff check mlops train.py predict.py api.py tests/test_workflow.py
          python -m ruff format --check mlops train.py tests/test_workflow.py
      - name: Reproduce and verify the demo pipeline
        run: |
          dvc repro
          dvc repro
          dvc status --json | python -c 'import json, sys; assert json.load(sys.stdin) == {}'
          PRET_DREPT_MODEL=artifacts/demo/model.joblib python -m pytest -q
          python predict.py --model artifacts/demo/model.joblib
      - name: Log and read back an MLflow run
        run: |
          run_id=$(.venv-mlflow/bin/python -m mlops.track artifacts/demo)
          .venv-mlflow/bin/python - "$run_id" <<'PY'
          import json
          import sys
          from pathlib import Path
          from mlflow import MlflowClient

          client = MlflowClient(tracking_uri=f"sqlite:///{Path('.mlflow/mlflow.db').resolve()}")
          run = client.get_run(sys.argv[1])
          report = json.loads(Path("artifacts/demo/evaluation.json").read_text())
          assert run.info.status == "FINISHED" and run.data.tags["dataset"] == "synthetic"
          assert run.data.params["seed"] == str(report["parameters"]["seed"])
          assert run.data.metrics["mae_eur"] == report["metrics"]["mae_eur"]
          assert {file.path for file in client.list_artifacts(run.info.run_id)} == {
              "dataset.json", "evaluation.json"
          }
          print(f"Verified synthetic MLflow run {run.info.run_id}")
          PY
      - name: Build and exercise the inference container
        run: |
          docker build -t pret-drept:ci .
          bash scripts/smoke_container.sh pret-drept:ci artifacts/demo/model.joblib
