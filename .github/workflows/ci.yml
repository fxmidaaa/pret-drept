name: MLOps checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13.16"
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check
          python -m venv .venv-catboost
          .venv-catboost/bin/python -m pip install catboost==1.2.10 numpy==2.5.4 pandas==3.1.1 mlflow-skinny==3.14.0
          .venv-catboost/bin/python -m pip check
      - name: Lint and check formatting
        run: |
          python -m ruff check mlops *.py tests
          python -m ruff format --check mlops *.py tests
      - name: Run the fixture pipeline and tests
        run: |
          dvc stage list --all --fail
          fixture_run="$RUNNER_TEMP/pret-drept-fixture"
          python -m mlops.prepare data/sample/demo.csv "$fixture_run" --synthetic
          python train.py "$fixture_run"
          python -m mlops.evaluate "$fixture_run"
          python predict.py --model "$fixture_run/model.joblib"
          PRET_DREPT_MODEL="$fixture_run/model.joblib" python -m pytest -q
          python -m mlops.track "$fixture_run" --store "$RUNNER_TEMP/pret-drept-tracking" --register
      - name: Test the API and Spark in Docker
        run: |
          docker build -t pret-drept:ci .
          bash scripts/smoke_container.sh pret-drept:ci "$RUNNER_TEMP/pret-drept-fixture/model.joblib"
