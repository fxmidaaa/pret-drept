stages:
  prepare:
    cmd: python -m mlops.prepare data/dataset/listings.csv artifacts/real --snapshot data/dataset/snapshot.json
    deps:
      - data/dataset/listings.csv
      - data/dataset/snapshot.json
      - features.py
      - mlops/config.py
      - mlops/files.py
      - mlops/prepare.py
      - mlops/dataset.py
      - requirements-serve.txt
    params:
      - params.json:
          - seed
          - evaluation_fraction
    outs:
      - artifacts/real/train.csv
      - artifacts/real/evaluation.csv
      - artifacts/real/dataset.json
  train:
    cmd: python train.py artifacts/real
    deps:
      - artifacts/real/train.csv
      - train.py
      - features.py
      - predict.py
      - mlops/config.py
      - mlops/files.py
      - mlops/prepare.py
      - requirements-serve.txt
    params:
      - params.json:
          - seed
          - evaluation_fraction
          - model
    outs:
      - artifacts/real/model.joblib
  evaluate:
    cmd: python -m mlops.evaluate artifacts/real
    deps:
      - artifacts/real/dataset.json
      - artifacts/real/evaluation.csv
      - artifacts/real/model.joblib
      - features.py
      - predict.py
      - mlops/config.py
      - mlops/evaluate.py
      - mlops/models.py
      - mlops/files.py
      - mlops/prepare.py
      - requirements-serve.txt
    metrics:
      - artifacts/real/evaluation.json:
          cache: true
