<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Is this Chișinău apartment overpriced?</title>
<style>
  :root {
    --bg: #f4f6fb;
    --card: #ffffff;
    --ink: #1f2733;
    --muted: #6b7685;
    --line: #e3e8f0;
    --accent: #3a6df0;
    --accent-soft: #eaf0fe;
    --green: #1a9d6a;
    --green-soft: #e6f6ef;
    --red: #d8453e;
    --red-soft: #fdecec;
    --blue: #3a6df0;
    --blue-soft: #eaf0fe;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.5;
    padding: 32px 16px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 24px; }
  header h1 { font-size: 1.7rem; margin: 0 0 6px; }
  header p { color: var(--muted); margin: 0; font-size: 0.95rem; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 24px;
    box-shadow: 0 6px 24px rgba(31, 39, 51, 0.05);
  }
  .section-title {
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    margin: 18px 0 10px;
    font-weight: 600;
  }
  .section-title:first-child { margin-top: 0; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 540px) { .grid { grid-template-columns: 1fr; } }
  label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 4px; }
  input[type="number"], select {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 10px;
    font-size: 0.95rem;
    background: #fff;
    color: var(--ink);
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  input[type="number"]:focus, select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .amenities { display: flex; flex-wrap: wrap; gap: 10px; }
  .chk {
    display: flex; align-items: center; gap: 8px;
    border: 1px solid var(--line); border-radius: 10px;
    padding: 9px 13px; cursor: pointer; user-select: none;
    font-size: 0.9rem; transition: all 0.15s;
  }
  .chk input { accent-color: var(--accent); width: 16px; height: 16px; }
  .chk:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
  button {
    width: 100%; margin-top: 22px;
    background: var(--accent); color: #fff; border: none;
    padding: 14px; font-size: 1rem; font-weight: 600;
    border-radius: 12px; cursor: pointer; transition: background 0.15s;
  }
  button:hover { background: #2f5fd6; }
  button:disabled { opacity: 0.6; cursor: default; }

  #result { margin-top: 20px; }
  .result-card { text-align: center; padding: 26px 20px; }
  .fair-label { color: var(--muted); font-size: 0.85rem; }
  .fair-price { font-size: 2.4rem; font-weight: 700; margin: 4px 0 14px; }
  .badge {
    display: inline-block; padding: 8px 18px; border-radius: 999px;
    font-weight: 600; font-size: 0.95rem;
  }
  .badge.overpriced { background: var(--red-soft); color: var(--red); }
  .badge.good       { background: var(--green-soft); color: var(--green); }
  .badge.fair       { background: var(--blue-soft); color: var(--blue); }
  .dev-text { color: var(--muted); font-size: 0.9rem; margin-top: 10px; }
  .drivers { margin-top: 20px; text-align: left; }
  .drivers h3 { font-size: 0.85rem; color: var(--muted); margin: 0 0 8px; font-weight: 600; }
  .driver {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 0; border-top: 1px solid var(--line); font-size: 0.92rem;
  }
  .driver .arrow { font-size: 1.05rem; }
  .driver .up { color: var(--red); }
  .driver .down { color: var(--green); }
  .driver .effect { margin-left: auto; color: var(--muted); font-size: 0.82rem; }
  .price-unit { font-size: 1rem; color: var(--muted); font-weight: 400; }
  .error-list { text-align: left; margin-bottom: 0; }
  input[aria-invalid="true"], select[aria-invalid="true"] { border-color: var(--red); }
  footer { text-align: center; color: var(--muted); font-size: 0.8rem; margin-top: 20px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🏠 Is this Chișinău apartment overpriced?</h1>
    <p>Fill in the apartment details and get an estimated fair monthly rent.</p>
  </header>

  <div class="card">
    <form id="form">
      <div class="section-title">Basics</div>
      <div class="grid">
        <div><label for="rooms">Rooms</label><input type="number" id="rooms" min="1" max="6" value="2"></div>
        <div><label for="area">Area (m²)</label><input type="number" id="area" min="10" max="400" value="55"></div>
        <div><label for="floor">Floor</label><input type="number" id="floor" min="1" max="30" value="3"></div>
        <div><label for="total_floors">Floors in building</label><input type="number" id="total_floors" min="1" max="30" value="9"></div>
        <div><label for="balcony_count">Balconies</label><input type="number" id="balcony_count" min="0" max="4" value="0"></div>
        <div><label for="bathrooms">Bathrooms</label><input type="number" id="bathrooms" min="1" max="4" value="1"></div>
        <div><label for="kitchen_area">Kitchen area (m²) — optional</label><input type="number" id="kitchen_area" min="3" max="60" placeholder="optional"></div>
        <div style="grid-column: 1 / -1;"><label for="ceiling_height">Ceiling height (m) — optional</label><input type="number" id="ceiling_height" min="2" max="4.5" step="0.1" placeholder="optional"></div>
      </div>

      <div class="section-title">Location & building</div>
      <div class="grid">
        <div><label for="sector">Sector</label><select id="sector"></select></div>
        <div><label for="author">Listing by</label><select id="author"></select></div>
        <div><label for="building_fund">Building fund</label><select id="building_fund"></select></div>
        <div><label for="condition">Condition</label><select id="condition"></select></div>
      </div>

      <div class="section-title">Amenities</div>
      <div class="amenities">
        <label class="chk"><input type="checkbox" id="autonomous_heating"> Autonomous heating</label>
        <label class="chk"><input type="checkbox" id="furnished" checked> Furnished</label>
        <label class="chk"><input type="checkbox" id="elevator"> Elevator</label>
        <label class="chk"><input type="checkbox" id="parking"> Parking</label>
        <label class="chk"><input type="checkbox" id="air_conditioning"> Air conditioning</label>
        <label class="chk"><input type="checkbox" id="floor_heating"> Floor heating</label>
        <label class="chk"><input type="checkbox" id="terrace"> Terrace</label>
        <label class="chk"><input type="checkbox" id="panoramic_windows"> Panoramic windows</label>
        <label class="chk"><input type="checkbox" id="utilities_included"> Utilities included in rent</label>
        <label class="chk"><input type="checkbox" id="lux"> Premium building / finishes</label>
      </div>

      <div class="section-title">Asking rent</div>
      <div class="grid">
        <div style="grid-column: 1 / -1;">
          <label for="price">Listed rent (EUR / month) — optional, to get a verdict</label>
          <input type="number" id="price" min="0" value="600" step="50">
        </div>
      </div>

      <button type="submit" id="submitBtn" disabled>Loading options…</button>
    </form>
  </div>

  <div id="result" role="status" aria-live="polite" aria-atomic="true" hidden></div>

  <footer>Learning project · estimates are not professional advice · data from 999.md</footer>
</div>

<script>
"use strict";

/**
 * @typedef {{feature: string, effect: "raises price"|"lowers price"}} Driver
 * @typedef {{fair_price: number, drivers: Driver[], verdict?: string, deviation_pct?: number}} Prediction
 * @typedef {{sector: string[], author: string[], building_fund: string[], condition: string[]}} Options
 * @typedef {{field: string, message: string}} FieldError
 * @typedef {{kind: "validation", errors: FieldError[]}|{kind: "service"|"network"|"invalid"}} Failure
 */

const FIELD_LABELS = {
  rooms: "Rooms", area: "Area", floor: "Floor", total_floors: "Floors in building",
  balcony_count: "Balconies", bathrooms: "Bathrooms", kitchen_area: "Kitchen area",
  ceiling_height: "Ceiling height", sector: "Sector", author: "Listing by",
  building_fund: "Building fund", condition: "Condition", price: "Listed rent",
  autonomous_heating: "Autonomous heating", furnished: "Furnished", elevator: "Elevator",
  parking: "Parking", air_conditioning: "Air conditioning", floor_heating: "Floor heating",
  terrace: "Terrace", panoramic_windows: "Panoramic windows",
  utilities_included: "Utilities included in rent", lux: "Premium building / finishes"
};
const OPTION_FIELDS = ["sector", "author", "building_fund", "condition"];
const VERDICTS = {
  "overpriced": {className: "overpriced", label: "Overpriced"},
  "good deal": {className: "good", label: "Good deal"},
  "fair price": {className: "fair", label: "Fair price"}
};
const isObject = value => value !== null && typeof value === "object" && !Array.isArray(value);
const isText = value => typeof value === "string" && value.trim().length > 0;

/** @param {unknown} value @returns {Prediction|null} */
function parsePrediction(value) {
  if (!isObject(value) || !Number.isFinite(value.fair_price) || value.fair_price <= 0) return null;
  const drivers = value.drivers === undefined ? [] : value.drivers;
  if (!Array.isArray(drivers) || !drivers.every(driver =>
    isObject(driver) && isText(driver.feature) &&
    ["raises price", "lowers price"].includes(driver.effect))) return null;
  const prediction = {
    fair_price: value.fair_price,
    drivers: drivers.map(({feature, effect}) => ({feature, effect}))
  };
  if (value.verdict !== undefined) {
    if (typeof value.verdict !== "string" || !Object.hasOwn(VERDICTS, value.verdict) ||
        !Number.isFinite(value.deviation_pct)) return null;
    prediction.verdict = value.verdict;
    prediction.deviation_pct = value.deviation_pct;
  }
  return prediction;
}

/** @param {unknown} value @returns {Options|null} */
function parseOptions(value) {
  if (!isObject(value) || !OPTION_FIELDS.every(field =>
    Array.isArray(value[field]) && value[field].length > 0 && value[field].every(isText))) return null;
  return Object.fromEntries(OPTION_FIELDS.map(field => [field, [...value[field]]]));
}

/** Extract recognized field messages only; never render raw input/context objects. */
function parseFieldErrors(value) {
  const errors = new Map();
  if (isObject(value) && Array.isArray(value.detail)) {
    for (const error of value.detail) {
      if (!isObject(error) || !Array.isArray(error.loc) || error.loc.length !== 2 ||
          error.loc[0] !== "body" || typeof error.loc[1] !== "string" ||
          !Object.hasOwn(FIELD_LABELS, error.loc[1]) || !isText(error.msg)) continue;
      if (!errors.has(error.loc[1])) errors.set(error.loc[1], error.msg);
    }
  }
  return [...errors].map(([field, message]) => ({field, message}));
}

/**
 * @template T
 * @param {string} url
 * @param {(value: unknown) => T|null} parse
 * @param {RequestInit} [init]
 * @returns {Promise<{kind: "success", data: T}|Failure>}
 */
async function requestJson(url, parse, init) {
  let response;
  try {
    response = await fetch(url, init);
  } catch {
    return {kind: "network"};
  }
  if (!response.ok && response.status !== 422) return {kind: "service"};
  let value;
  try {
    value = await response.json();
  } catch {
    return {kind: "invalid"};
  }
  if (response.status === 422) return {kind: "validation", errors: parseFieldErrors(value)};
  const data = parse(value);
  return data === null ? {kind: "invalid"} : {kind: "success", data};
}

// Dynamic content always enters the DOM as text, including error and driver labels.
function element(tag, className = "", text = "") {
  const node = document.createElement(tag);
  node.className = className;
  node.textContent = text;
  return node;
}

function showResult(card) {
  const result = document.getElementById("result");
  result.replaceChildren(card);
  result.hidden = false;
  result.scrollIntoView({behavior: "smooth", block: "nearest"});
}

function clearResult() {
  const result = document.getElementById("result");
  result.hidden = true;
  result.replaceChildren();
  for (const field of Object.keys(FIELD_LABELS)) {
    const control = document.getElementById(field);
    control.removeAttribute("aria-invalid");
    control.removeAttribute("aria-describedby");
  }
}

/** @param {Failure} failure */
function renderFailure(failure, loadingOptions = false) {
  const messages = {
    validation: "Please check the apartment details and try again.",
    service: "The service could not complete the request. Please try again.",
    network: "Could not reach the service. Check your connection and try again.",
    invalid: "The service returned an unexpected response. Please try again."
  };
  const card = element("div", "card result-card");
  if (loadingOptions) {
    card.appendChild(element("p", "", "Apartment options could not be loaded. Refresh the page to try again."));
  }
  card.appendChild(element("p", "", messages[failure.kind]));
  if (!loadingOptions && failure.kind === "validation" && failure.errors.length) {
    const list = element("ul", "error-list");
    for (const {field, message} of failure.errors) {
      const item = element("li", "", `${FIELD_LABELS[field]}: ${message}`);
      item.id = `error-${field}`;
      list.appendChild(item);
      const control = document.getElementById(field);
      control.setAttribute("aria-invalid", "true");
      control.setAttribute("aria-describedby", item.id);
    }
    card.appendChild(list);
  }
  showResult(card);
}

/** @param {Prediction} data */
function renderPrediction(data) {
  const card = element("div", "card result-card");
  card.appendChild(element("div", "fair-label", "Estimated fair rent"));
  const price = element("div", "fair-price", `€${data.fair_price.toLocaleString()}`);
  price.appendChild(element("span", "price-unit", " / month"));
  card.appendChild(price);
  if (data.verdict !== undefined) {
    const verdict = VERDICTS[data.verdict];
    card.appendChild(element("div", `badge ${verdict.className}`, verdict.label));
    const deviation = data.deviation_pct;
    const text = Math.abs(deviation) < 0.5 ? "Right on the market rate." :
      `The listing is about ${Math.abs(deviation).toFixed(0)}% ${deviation > 0 ? "above" : "below"} the estimated market rent.`;
    card.appendChild(element("div", "dev-text", text));
  }
  if (data.drivers.length) {
    const drivers = element("div", "drivers");
    drivers.appendChild(element("h3", "", "What drove this estimate"));
    for (const driver of data.drivers) {
      const up = driver.effect === "raises price";
      const row = element("div", "driver");
      row.appendChild(element("span", `arrow ${up ? "up" : "down"}`, up ? "▲" : "▼"));
      row.appendChild(element("span", "", driver.feature));
      row.appendChild(element("span", "effect", up ? "raises rent" : "lowers rent"));
      drivers.appendChild(row);
    }
    card.appendChild(drivers);
  }
  showResult(card);
}

// nicer labels for the romanian option values, while still submitting the raw value
const NICE = {
  building_fund: { "construcţii noi": "New build", "secundar": "Secondary (older stock)" },
  author: {
    "agenție": "Real-estate agency",
    "persoană fizică": "Owner (private person)",
    "dezvoltator imobiliar": "Developer"
  },
  condition: {
    "euroreparație": "Euro-renovation",
    "reparație cosmetică": "Cosmetic renovation",
    "design individual": "Individual design",
    "are nevoie de reparație": "Needs renovation",
    "fără reparație": "No renovation",
    "dat în exploatare": "Newly delivered",
    "variantă albă": "White-box (unfinished)",
    "necunoscut": "Not specified"
  }
};
const titleCase = s => s.replace(/\b\w/g, c => c.toUpperCase());

function fillSelect(id, values) {
  const sel = document.getElementById(id);
  values.forEach(v => {
    const opt = document.createElement("option");
    opt.value = v;
    opt.textContent = NICE[id] && Object.hasOwn(NICE[id], v) ? NICE[id][v] : titleCase(v);
    sel.appendChild(opt);
  });
}

const button = document.getElementById("submitBtn");
let optionsReady = false;
let submitting = false;

async function loadOptions() {
  const result = await requestJson("/options", parseOptions);
  if (result.kind !== "success") {
    renderFailure(result, true);
    button.textContent = "Options unavailable";
    return;
  }
  for (const field of OPTION_FIELDS) fillSelect(field, result.data[field]);
  if (result.data.sector.includes("centru")) document.getElementById("sector").value = "centru";
  optionsReady = true;
  button.disabled = false;
  button.textContent = "Estimate fair rent";
}

const num = id => Number(document.getElementById(id).value);
// optional numeric: blank -> null (so the API imputes it instead of getting 0)
const numOrNull = id => {
  const v = document.getElementById(id).value;
  return v === "" ? null : Number(v);
};
const chk = id => document.getElementById(id).checked ? 1 : 0;

document.getElementById("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  if (!optionsReady || submitting) return;
  submitting = true;
  button.disabled = true;
  button.textContent = "Estimating…";
  clearResult();

  const floor = num("floor"), total = num("total_floors");
  const body = {
    rooms: num("rooms"), area: num("area"), floor: floor, total_floors: total,
    balcony_count: num("balcony_count"),
    bathrooms: num("bathrooms"),
    kitchen_area: numOrNull("kitchen_area"),
    ceiling_height: numOrNull("ceiling_height"),
    sector: document.getElementById("sector").value,
    author: document.getElementById("author").value,
    building_fund: document.getElementById("building_fund").value,
    condition: document.getElementById("condition").value,
    autonomous_heating: chk("autonomous_heating"),
    furnished: chk("furnished"),
    elevator: chk("elevator"),
    parking: chk("parking"),
    air_conditioning: chk("air_conditioning"),
    floor_heating: chk("floor_heating"),
    terrace: chk("terrace"),
    panoramic_windows: chk("panoramic_windows"),
    utilities_included: chk("utilities_included"),
    lux: chk("lux"),
    price: num("price") > 0 ? num("price") : null
  };

  try {
    const result = await requestJson("/predict", parsePrediction, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });
    if (result.kind === "success") renderPrediction(result.data);
    else renderFailure(result);
  } finally {
    submitting = false;
    button.disabled = false;
    button.textContent = "Estimate fair rent";
  }
});

void loadOptions();
</script>
</body>
</html>
